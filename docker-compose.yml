# Coolify: Build Pack = Docker Compose, file = docker-compose.yml (repo root).
# Assign your public domain to the `web` service (container port 80).
# `api` and `redis` stay on the internal compose network.
#
# Local full stack:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build

services:
  web:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-}
        EXPO_PUBLIC_SHARE_ORIGIN: ${EXPO_PUBLIC_SHARE_ORIGIN:-}
    environment:
      - SERVICE_URL_WEB
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      PERSIST_CACHE: "false"
      WARM_ON_STARTUP: "true"
      PARTY_INSIDER_BASE_URL: ${PARTY_INSIDER_BASE_URL:-https://www.party-insider.com/wp-json}
      DEFAULT_CITY: ${DEFAULT_CITY:-Konstanz}
      TIMEZONE: ${TIMEZONE:-Europe/Zurich}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: ${DEBUG:-false}
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
