<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>KONSTANZ | Party & Event Finder</title>
    <meta name="description" content="Discover events, clubs, bars, and nightlife in Konstanz" />
    <meta name="theme-color" content="#080809" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KONSTANZ" />
    <meta name="application-name" content="KONSTANZ" />
    <meta name="format-detection" content="telephone=no" />
    <style>
      html,
      body,
      #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #080809;
      }
      html {
        height: 100%;
        height: 100dvh;
      }
      body {
        overflow: hidden;
        position: fixed;
        inset: 0;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #root {
        display: flex;
        flex: 1;
      }
      input,
      textarea {
        user-select: text;
        -webkit-user-select: text;
        font-size: 16px;
      }
      * {
        box-sizing: border-box;
      }
      ::-webkit-scrollbar {
        width: 0;
        height: 0;
        display: none;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
